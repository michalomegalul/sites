# quiz.dobsinsky.xyz — survey engine
#
# TRUST CONTRACT — same rules as portfolio/nginx.conf, read that first.
#   * The :8480 block is reached through the Cloudflare Tunnel and ALWAYS forces
#     X-Net: public. It never sets `lan` under any condition. That is what stops
#     a new subdomain being used to spoof into the portfolio's trusted mode.
#   * X-Real-IP is always overwritten by nginx, never passed through.
#   * cloudflared connects from localhost, so $remote_addr is 127.0.0.1 for
#     every public request. Anything that needs the real client — rate limiting
#     included — must key on $http_cf_connecting_ip.

# Rate-limit zones. Keyed on the Cloudflare client IP: keying on
# $binary_remote_addr here would bucket every visitor into 127.0.0.1 and
# throttle the whole site at once.
limit_req_zone $http_cf_connecting_ip zone=quiz_api:10m  rate=30r/m;
limit_req_zone $http_cf_connecting_ip zone=quiz_start:10m rate=5r/m;
limit_conn_zone $http_cf_connecting_ip zone=quiz_conn:10m;

# nginx answers 503 by default, which reads as "the site is broken" and is the
# wrong status besides. The frontend already treats 429 as "slow down".
limit_req_status 429;
limit_conn_status 429;

# ---------- PUBLIC: behind Cloudflare Tunnel ----------
server {
    listen 127.0.0.1:8480;
    server_name quiz.dobsinsky.xyz;

    root /opt/sites/quiz/site;
    index index.html;

    # Restore the real client IP from Cloudflare, trusting only cloudflared on
    # localhost to have set it. Scoped to THIS block on purpose — the internal
    # block below must keep $remote_addr as the actual LAN peer.
    #
    # Without this, $remote_addr and every access-log line for public traffic
    # read 127.0.0.1, and a log-reading blocker like CrowdSec would decide the
    # loopback address is an attacker and ban the entire site.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 256k;
    limit_conn quiz_conn 20;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Nothing third-party is permitted, full stop. This used to allow-list
    # googletagmanager and google-analytics for the GA tag; the tag is gone and
    # so are the exceptions. `default-src 'self'` with no external origin
    # anywhere is now the whole policy, which means a script added by accident
    # is blocked rather than merely discouraged.
    #
    # 'unsafe-inline' remains on style-src only, for the inline style properties
    # the theme picker and body map set. Scripts get no such allowance, which is
    # why the pre-paint theme applier is a file (js/theme.js) and not inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Admin endpoints must never be reachable from the internet. The API also
    # checks this itself; this is the belt to that pair of braces.
    location /api/admin/ {
        return 404;
    }

    # The dashboard and editor are static files in the same document root, so
    # they would otherwise be served publicly. Their API calls would 404, but
    # there is no reason to hand out the pages at all.
    location = /admin.html {
        return 404;
    }
    location = /editor.html {
        return 404;
    }

    location = /api/s/endo-2026/start {
        limit_req zone=quiz_start burst=3 nodelay;
        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Net public;
    }

    location /api/ {
        limit_req zone=quiz_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Net public;
    }

    # Short cache, not a long one: there is no cache-busting in the filenames,
    # so a week-long TTL would strand people on an old app.js after a deploy.
    #
    # No add_header here on purpose. add_header is inherited only while the
    # current level declares none of its own — adding one would silently drop
    # all four security headers above for every CSS and JS response. `expires`
    # sets Cache-Control by itself and does not break the inheritance.
    location ~* \.(css|js|svg|png|jpe?g|webp|woff2)$ {
        expires 1h;
    }

    # Same reason as the internal block: a missing .html is a 404, never a
    # silent fall-through to the survey app.
    location ~ \.html$ {
        try_files $uri =404;
    }

    # /{locale}/s/{slug} and /{locale}/s/{slug}/print are client-routed.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- INTERNAL: LAN + Tailscale, for the researcher ----------
# This is the only block that may set X-Net: lan, and it is not reachable
# through the tunnel. Admin export and the aggregate dashboard live here.
server {
    listen 192.168.4.37:80;          # this LXC's LAN IP, needs a quiz.internal DNS record
    # A second LAN port that works with NO DNS at all: http://192.168.4.37:8081/
    # default_server on this port means it answers whatever Host arrives, so the
    # bare IP is enough. Bound to the LAN address only, so the tunnel cannot
    # reach it and this stays as internal as the :80 block.
    listen 192.168.4.37:8081 default_server;
    # listen 100.x.y.z:80;           # optionally also the Tailscale IP
    server_name quiz.internal;

    root /opt/sites/quiz/site;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Net lan;
    }

    # A missing .html must 404, not fall through to the survey app below.
    # Without this, an editor.html that has not been deployed yet silently
    # serves index.html, which boots the questionnaire, fails to parse the
    # route, and reports "could not load the questionnaire" — which looks like
    # a broken survey rather than a missing file.
    location ~ \.html$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
