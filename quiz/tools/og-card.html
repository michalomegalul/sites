<!doctype html>
<!-- Source for quiz/site/img/og.png. Regenerate after editing:
       chromium --headless --disable-gpu --hide-scrollbars \
         --screenshot=quiz/site/img/og.png --window-size=1200,630 \
         file://$PWD/quiz/tools/og-card.html

     Rendered rather than hand-drawn so the type is real type. Fonts come from
     the portfolio's self-hosted copies via a relative path, which is why this
     file has to stay at this depth. 1200x630 is the size Facebook, LinkedIn and
     WhatsApp all crop from. -->
<meta charset="utf-8">
<style>
  /* BOTH subsets, with their unicode-ranges. Google splits the font: `latin`
     holds ASCII and `latin-ext` only the extras, so declaring latin-ext alone
     left every ordinary letter to a fallback font — the card rendered in the
     wrong typeface while the Czech diacritics looked fine, which is a confusing
     way to be broken. Ranges copied from portfolio/site/css/fonts.css. */
  @font-face {
    font-family: 'Archivo Black';
    src: url('../../portfolio/site/fonts/ArchivoBlack-400-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
      U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
      U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Archivo Black';
    src: url('../../portfolio/site/fonts/ArchivoBlack-400-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
      U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
      U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: center;
    padding: 76px 88px;
    background: #fbeef4;
    font-family: 'Archivo Black', system-ui, sans-serif;
    color: #3a1f2e;
    position: relative;
    overflow: hidden;
  }
  .eyebrow {
    font-family: system-ui, sans-serif;
    font-size: 26px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: #8d3f66;
    margin-bottom: 26px;
  }
  h1 { font-size: 92px; line-height: 1.03; letter-spacing: -.02em; max-width: 15ch; }
  p {
    font-family: system-ui, sans-serif;
    font-size: 31px; line-height: 1.45; color: #6a5f6d;
    margin-top: 30px; max-width: 30ch;
  }
  .url {
    font-family: ui-monospace, monospace;
    font-size: 25px; color: #8d3f66; margin-top: 42px; font-weight: 600;
  }
  /* The daisy from the favicon, oversized and bled off the right edge. */
  .mark { position: absolute; right: -110px; bottom: -130px; opacity: .5; }
</style>

<div class="eyebrow">Anonymní dotazník</div>
<h1>Co víte o endometrióze?</h1>
<p>Dvanáct otázek. U každé se hned dozvíte, jak to je.</p>
<div class="url">quiz.dobsinsky.dev</div>

<svg class="mark" width="520" height="520" viewBox="0 0 64 64">
  <g transform="translate(32 32)">
    <g fill="#e7a8c4">
      <ellipse cx="0" cy="-13" rx="6.5" ry="10"/>
      <ellipse cx="0" cy="-13" rx="6.5" ry="10" transform="rotate(60)"/>
      <ellipse cx="0" cy="-13" rx="6.5" ry="10" transform="rotate(120)"/>
      <ellipse cx="0" cy="-13" rx="6.5" ry="10" transform="rotate(180)"/>
      <ellipse cx="0" cy="-13" rx="6.5" ry="10" transform="rotate(240)"/>
      <ellipse cx="0" cy="-13" rx="6.5" ry="10" transform="rotate(300)"/>
    </g>
    <circle r="7" fill="#c2557f"/>
  </g>
</svg>
