<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Dotazník</title>

<!-- Link preview. This is what a pasted link looks like in Messenger, WhatsApp
     or an Instagram DM — which is how this survey is actually distributed, so it
     is worth more here than on a site people reach by searching.

     noindex above and these tags are not in conflict: the preview bots read Open
     Graph and generate a card, they do not index. robots.txt allows them by name
     for exactly that reason.

     og:url is the chooser rather than a specific questionnaire, because a shared
     link should let people pick. Absolute URLs are required — a relative
     og:image is ignored by most scrapers. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="quiz.dobsinsky.dev">
<meta property="og:locale" content="cs_CZ">
<meta property="og:locale:alternate" content="en_GB">
<meta property="og:url" content="https://quiz.dobsinsky.dev/">
<meta property="og:title" content="Co víte o endometrióze?">
<meta property="og:description" content="Anonymní dotazník pro odbornou práci. Dvanáct otázek — u každé se hned dozvíte, jak to je.">
<meta property="og:image" content="https://quiz.dobsinsky.dev/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Co víte o endometrióze? Anonymní dotazník.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Before the stylesheet, and not deferred, so the survey's colours are the
     first thing painted rather than a flash of the default. palette.js derives
     the palette and clamps contrast; theme.js replays the cached accent. Both
     are files, not inline blocks, because the CSP is script-src 'self'. -->
<script src="/js/palette.js"></script>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<a class="skip" href="#screen">Přeskočit na obsah</a>

<header id="sitebar">
  <div class="sitebar-row">
    <a class="sitebar__brand" id="brand" href="/">Endometrióza</a>
    <nav class="lang lang--bar" id="sitebar-lang"></nav>
    <button id="theme-toggle" class="icon-btn" type="button">
      <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>
      </svg>
    </button>
  </div>
</header>

<header id="bar" hidden>
  <div class="bar-row">
    <button id="back" class="icon-btn" type="button" aria-label="Zpět">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-fill"></div>
    </div>
    <span id="progress-text" class="progress-text">0 / 0</span>
  </div>
  <div id="saved" class="saved" aria-live="polite"></div>
</header>

<main id="screen" tabindex="-1"></main>

<footer class="sitefoot" id="sitefoot" hidden></footer>

<noscript>
  <div class="noscript">
    <p>Tento dotazník potřebuje zapnutý JavaScript. Odpovědi se totiž ukládají
       průběžně, abyste mohla kdykoli přestat a vrátit se později.</p>
    <p>This questionnaire needs JavaScript enabled, so that your answers save as
       you go and you can stop and come back later.</p>
  </div>
</noscript>

<script src="/js/config.js"></script>
<!-- theme.js already ran in <head>; app.js reuses the globals it defined. -->
<script src="/js/i18n.js"></script>
<script src="/js/bodymap.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
