# dobsinsky.dev portfolio - nginx
#
# TRUST CONTRACT (the whole security model lives here):
#   * X-Net: lan      → ONLY set on the internal server block (LAN/Tailscale listen)
#   * X-Net: public   → set on the Cloudflare-Tunnel-facing block
#   * X-Real-IP       → always overwritten by nginx, never passed through from client
#
# cloudflared connects from localhost, so remote_addr there is 127.0.0.1 -
# that's why the public block MUST use CF-Connecting-IP and force X-Net=public.

# One shared budget per client IP for the API, which is what the DEFENCE panel
# on the page promises ("30 req/min per ip on /api/"). A page view makes about
# eight API calls and the open page polls twice a minute; the burst lets someone
# reload four or five times in a row before the steady rate applies. limit_req_zone has to live at http level;
# this file is included inside http {} from sites-enabled, so file level is it.
limit_req_zone $binary_remote_addr zone=portfolio_api:10m rate=30r/m;

# ---------- PUBLIC: behind Cloudflare Tunnel ----------
server {
    listen 127.0.0.1:8480;           # cloudflared ingress points here
    server_name dobsinsky.dev;

    root /opt/sites/portfolio/site;
    index index.html;

    # Restore the real client IP from Cloudflare, trusting only cloudflared on
    # localhost to have set the header. Scoped to THIS block: the internal block
    # below must keep $remote_addr as the actual LAN peer.
    #
    # Without this every public access-log line reads 127.0.0.1, and a
    # log-reading blocker like CrowdSec attributes all traffic - attacks
    # included - to the loopback address and eventually bans it, which takes
    # the whole box off the internet while looking like a random outage.
    # quiz/nginx.conf has carried these two lines from the start; this block is
    # the one the README flagged as still missing them.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # cloudflared reaches nginx over plain http either way, so the scheme the
    # visitor used comes from Cloudflare's CF-Visitor header. Without this
    # http:// answered 200 with the same page, and Search Console counted it as
    # a duplicate. Cloudflare's "Always Use HTTPS" does the same at the edge;
    # this keeps it true even if that toggle gets switched off.
    if ($http_cf_visitor ~ '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    server_tokens off;
    include /opt/sites/portfolio/security-headers.conf;
    # Public block only: home.dobsinsky.dev is plain http on the LAN, so no
    # includeSubDomains, or browsers would refuse it.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        # After real_ip above, so this is the visitor's address, not cloudflared's.
        limit_req zone=portfolio_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Net public;
    }

    # Self-hosted fonts genuinely never change - weight and subset are both in
    # the filename - so a year is safe. vendor/ gets a week instead: gsap.min.js
    # carries no hash, and a year-long TTL would strand visitors on an old copy
    # after a version bump.
    location /fonts/  { expires 1y; access_log off; }
    location /vendor/ { expires 7d; }

    # The page and the project list revalidate every time, so a deploy shows up
    # at once instead of after Cloudflare's default four hours. `expires epoch`
    # rather than add_header, which would drop the security headers (see the
    # trap in security-headers.conf).
    location = /index.html {
        # /index.html is the same page as /, and Search Console flagged it as a
        # duplicate. $request_uri is what the client asked for, so the internal
        # index lookup for / lands here without looping.
        if ($request_uri ~ "^/index\.html") {
            return 301 /;
        }
        expires epoch;
    }
    location = /projects.json { expires epoch; }

    # The PDF says the same as cv.html and cannot carry a canonical tag itself.
    # add_header here drops the server-level ones, hence the include again.
    location = /cv.pdf {
        include /opt/sites/portfolio/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Link '<https://dobsinsky.dev/cv.html>; rel="canonical"' always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---------- INTERNAL: LAN + Tailscale ----------
server {
    # default_server so a request by bare IP lands here rather than on whichever
    # block for this address:port nginx happened to load first - quiz.internal
    # also listens on .37:80, and the winner was filename order.
    listen 192.168.4.37:80 default_server;
    # listen 100.x.y.z:80;           # optionally also the Tailscale IP
    server_name home.dobsinsky.dev dobsinsky.internal 192.168.4.37;

    root /opt/sites/portfolio/site;
    index index.html;

    server_tokens off;
    include /opt/sites/portfolio/security-headers.conf;

    # Shortcut to the quiz admin from the LAN. Points at the IP:port form, not
    # quiz.internal, because that hostname needs a DNS record that does not
    # exist - a redirect to a name the browser cannot resolve is worse than no
    # redirect. The header link uses the same target.
    location = /quiz  { return 302 http://192.168.4.37:8081/; }
    location = /quiz/ { return 302 http://192.168.4.37:8081/; }

    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Net lan;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
