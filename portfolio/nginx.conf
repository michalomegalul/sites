# dobsinsky.xyz portfolio — nginx
#
# TRUST CONTRACT (the whole security model lives here):
#   * X-Net: lan      → ONLY set on the internal server block (LAN/Tailscale listen)
#   * X-Net: public   → set on the Cloudflare-Tunnel-facing block
#   * X-Real-IP       → always overwritten by nginx, never passed through from client
#
# cloudflared connects from localhost, so remote_addr there is 127.0.0.1 —
# that's why the public block MUST use CF-Connecting-IP and force X-Net=public.

# ---------- PUBLIC: behind Cloudflare Tunnel ----------
server {
    listen 127.0.0.1:8480;           # cloudflared ingress points here
    server_name dobsinsky.xyz;

    root /opt/portfolio/site;
    index index.html;

    # Restore the real client IP from Cloudflare, trusting only cloudflared on
    # localhost to have set the header. Scoped to THIS block: the internal block
    # below must keep $remote_addr as the actual LAN peer.
    #
    # Without this every public access-log line reads 127.0.0.1, and a
    # log-reading blocker like CrowdSec attributes all traffic — attacks
    # included — to the loopback address and eventually bans it, which takes
    # the whole box off the internet while looking like a random outage.
    # quiz/nginx.conf has carried these two lines from the start; this block is
    # the one the README flagged as still missing them.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Net public;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---------- INTERNAL: LAN + Tailscale ----------
server {
    listen 192.168.4.30:80;          # change to this LXC's LAN IP
    # listen 100.x.y.z:80;           # optionally also the Tailscale IP
    server_name home.dobsinsky.xyz dobsinsky.internal;

    root /opt/portfolio/site;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Net lan;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
