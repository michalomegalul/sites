<?xml version="1.0" encoding="UTF-8"?>
<!-- dobsinsky.xyz — the `;;` that opens every comment line in a dig answer,
     which is the whole visual idiom of the site. Drawn as shapes rather than
     <text> because a favicon cannot rely on a font being available. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="dobsinsky.xyz">
  <rect width="64" height="64" rx="10" fill="#0C0C0E"/>
  <!-- two semicolons: dot over comma, twice -->
  <g fill="#FFB000">
    <rect x="16" y="20" width="7" height="7" rx="1.5"/>
    <rect x="16" y="35" width="7" height="7" rx="1.5"/>
    <path d="M16 42h7v4c0 3-2 5-5 5.5v-3.5c1.5-.5 2-1.5 2-3z"/>

    <rect x="34" y="20" width="7" height="7" rx="1.5"/>
    <rect x="34" y="35" width="7" height="7" rx="1.5"/>
    <path d="M34 42h7v4c0 3-2 5-5 5.5v-3.5c1.5-.5 2-1.5 2-3z"/>
  </g>
</svg>
