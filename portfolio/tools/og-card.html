<!doctype html>
<!-- Source for portfolio/site/img/og.png. Regenerate after editing:
       chromium --headless --disable-gpu --hide-scrollbars \
         --screenshot=portfolio/site/img/og.png --window-size=1200,630 \
         file://$PWD/portfolio/tools/og-card.html

     Both font subsets are declared with their unicode-ranges: `latin` holds
     ASCII and `latin-ext` only the extras, so declaring one alone silently drops
     the card into a fallback typeface. Ranges match site/css/fonts.css. -->
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Archivo Black';
    src: url('../site/fonts/ArchivoBlack-400-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
      U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
      U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Archivo Black';
    src: url('../site/fonts/ArchivoBlack-400-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
      U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
      U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('../site/fonts/IBMPlexMono-400-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
      U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
      U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('../site/fonts/IBMPlexMono-400-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
      U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
      U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: center;
    padding: 70px 84px;
    background: #0C0C0E;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    color: #EDEAE2;
  }
  .dig { font-size: 25px; color: #FFB000; margin-bottom: 8px; }
  .dig--dim { color: #8d8a82; margin-bottom: 30px; }

  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 108px; line-height: 1.02; letter-spacing: -.02em;
  }
  /* Same offset-second-row treatment as the live hero. */
  .row2 { display: block; margin-left: 74px; color: #FFB000; }

  .soa { margin-top: 32px; border-left: 4px solid #FFB000; padding-left: 24px; }
  .line { display: flex; gap: 26px; font-size: 25px; padding: 3px 0; }
  .key { color: #8d8a82; font-weight: 700; min-width: 5ch; }
</style>
