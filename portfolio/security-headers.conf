# dobsinsky.dev portfolio - security headers, included by nginx.conf.
#
# Read from the checkout (/opt/sites/portfolio), so a change here ships with the
# normal deploy's nginx reload. nginx.conf itself is copied by hand, see README.
#
# TRAP: add_header is inherited only by locations that have no add_header of
# their own. A location that adds even one header silently drops all of these,
# so such a location must `include` this file again.

# Self only. The page loads nothing from another origin: fonts and GSAP are
# self-hosted and GitHub, Steam and the quiz count are relayed by /api. The
# JSON-LD block is not executed, so it needs no script exception, and the
# style="" attributes that used to be built in JS are classes or CSSOM now.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
